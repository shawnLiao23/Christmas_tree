  <style>
:root {
  color-scheme: dark;
  --night: #030711;
  --gold: #e1c69a;
  --safe-top: env(safe-area-inset-top, 0px);
  --safe-bottom: env(safe-area-inset-bottom, 0px);
  font-family: "Segoe UI", "Microsoft YaHei", sans-serif;
  font-synthesis: none;
}
* { box-sizing: border-box; }
html, body { margin: 0; width: 100%; min-height: 100%; background: var(--night); }
body { color: var(--gold); overflow: hidden; }
.ambience {
  position: fixed;
  inset: 0;
  pointer-events: none;
  background:
    radial-gradient(ellipse at 50% 46%, #10262e88 0, #07101d44 35%, transparent 70%),
    radial-gradient(ellipse at 14% 68%, #2b1d261a 0, transparent 42%),
    radial-gradient(ellipse at 88% 32%, #28352622 0, transparent 43%),
    var(--night);
}
.ambience::before,
.ambience::after {
  content: "";
  position: absolute;
  top: 19%;
  width: 1px;
  height: 48%;
  opacity: .24;
  background: linear-gradient(transparent, #b0925c50, transparent);
  box-shadow: 0 0 70px 20px #c6a36508;
}
.ambience::before { left: calc(50% - 40vh); }
.ambience::after { right: calc(50% - 40vh); }
.gift-shell {
  position: relative;
  width: 100%;
  height: 100vh;
  height: 100svh;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: max(8px, var(--safe-top)) 0 max(8px, var(--safe-bottom));
}
.stage {
  flex: 1;
  min-height: 0;
  width: 100%;
  display: grid;
  place-items: center;
}
.artwork {
  position: relative;
  width: min(100vw, calc((100vh - 68px - var(--safe-top) - var(--safe-bottom)) * .5625));
  width: min(100vw, calc((100svh - 68px - var(--safe-top) - var(--safe-bottom)) * .5625));
  aspect-ratio: 9 / 16;
  max-height: 100%;
  overflow: hidden;
  background: var(--night);
  -webkit-mask-image: linear-gradient(to right, transparent, #000 3%, #000 97%, transparent);
  mask-image: linear-gradient(to right, transparent, #000 3%, #000 97%, transparent);
}
canvas {
  display: block;
  width: 100%;
  height: 100%;
  object-fit: contain;
  touch-action: none;
  cursor: grab;
}
canvas:active { cursor: grabbing; }
.gift-controls {
  display: flex;
  flex: 0 0 44px;
  align-items: center;
  justify-content: center;
  gap: 12px;
  margin-top: 8px;
  z-index: 2;
}
.gift-controls button {
  min-width: 88px;
  min-height: 44px;
  border: 0;
  border-radius: 22px;
  padding: 10px 15px;
  background: transparent;
  color: #a5a59d;
  font: 14px/1.4 "Segoe UI", "Microsoft YaHei", sans-serif;
  letter-spacing: .1em;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
  transition: color .2s ease, background .2s ease;
}
.gift-controls button:hover { color: #f1d8a8; background: #d7bc8208; }
.gift-controls button:focus-visible { outline: 1px solid #e1c69a; outline-offset: 2px; }
.control-separator { color: #7d7255; font-size: 14px; }
.gift-shell:fullscreen,
body.immersive .gift-shell {
  position: fixed;
  inset: 0;
  width: 100vw;
  height: 100vh;
  height: 100dvh;
  padding: 0;
  z-index: 10;
  background: var(--night);
}
.gift-shell:fullscreen .artwork,
body.immersive .artwork {
  width: min(100vw, calc(100vh * .5625));
  width: min(100vw, calc(100dvh * .5625));
}
.gift-shell:fullscreen .gift-controls,
body.immersive .gift-controls {
  position: absolute;
  bottom: max(4px, var(--safe-bottom));
  margin: 0;
  padding: 0 12px;
  border-radius: 24px;
  background: #030711b0;
  backdrop-filter: blur(12px);
}
.sr-only {
  position: absolute;
  width: 1px;
  height: 1px;
  padding: 0;
  margin: -1px;
  overflow: hidden;
  clip: rect(0, 0, 0, 0);
  white-space: nowrap;
  border: 0;
}
@media (max-width: 700px) {
  .ambience::before, .ambience::after { display: none; }
  .artwork { -webkit-mask-image: none; mask-image: none; }
  .gift-controls { gap: 8px; }
}
@media (prefers-reduced-motion: reduce) {
  .gift-controls button { transition: none; }
}

</style>

<body>
  <div class="ambience" aria-hidden="true"></div>
  <main class="gift-shell" id="gift-shell">
    <h1 class="sr-only">marry Christmas tian zisu !</h1>
    <section class="stage" aria-label="献给 tian zisu 的圣诞礼物">
      <div class="artwork" id="artwork">
        <canvas id="scene" width="1080" height="1920" aria-label="marry Christmas tian zisu ! 星光中旋转的圣诞树，伴着金色灯光、礼物与飘雪。">marry Christmas tian zisu !</canvas>
      </div>
    </section>
    <nav class="gift-controls" aria-label="礼物播放控制">
      <button id="replay" type="button">再看一次</button>
      <span class="control-separator" aria-hidden="true">·</span>
      <button id="fullscreen" type="button" aria-pressed="false">全屏</button>
    </nav>
  </main>
  <div class="sr-only" id="status" role="status" aria-live="polite"></div>
  <script>
/* ASCII Christmas. All objects are projected 3D glyph clouds; no mesh images. */
(() => {
  'use strict';
  const canvas = document.querySelector('#scene');
  const ctx = canvas.getContext('2d', { alpha: false });
  const W = 1080, H = 1920, TAU = Math.PI * 2, D = 1650;
  canvas.width = W; canvas.height = H;
  const defaults = { speed: 1, snow: 1, glow: 1, greeting: 'marry Christmas tian zisu !', subtitle: '把这一夜的星光，都送给你。' };
  let options = { ...defaults }, time = 0, playing = true, last = performance.now(), view = 0;
  const clamp = n => Math.max(0, Math.min(1, n));
  const smooth = n => { n = clamp(n); return n * n * (3 - 2 * n); };
  let celebration = null;
  let seed = 20261225;
  const rand = () => ((seed = Math.imul(seed, 1664525) + 1013904223 >>> 0) / 4294967296);
  const pick = s => s[Math.floor(rand() * s.length)];
  const points = [], snow = [], sprites = new Map();
  const greens = ['#32bdaf', '#52d6c0', '#b2eee0', '#26a7b3', '#7bd9ed', '#99d7fd', '#9ccee1', '#45b79c'];
  const golds = ['#b47729', '#dfa744', '#f9cc67', '#ffe394', '#fff0bc', '#fff8df'];
  function add(x, y, z, ch, color, type = 'leaf', extra = {}) {
    points.push({ x, y, z, ch, color, type, phase: rand() * TAU, ...extra });
  }
  // Six overlapping whorls, with lobed branches instead of a smooth cone.
  function radius(y, a = 0) {
    const h = (y - 125) / 725;
    const tier = ((850 - y) / 111) % 1;
    const silhouette = 341 * (1 - h) * (0.78 + 0.22 * Math.pow(tier, 0.55));
    return silhouette * (1 + 0.055 * Math.sin(a * 7 + y * .014));
  }
  for (let y = 128; y <= 846; y += 8.3) {
    const r0 = radius(y), n = Math.max(5, Math.round(TAU * r0 / 10.8));
    for (let j = 0; j < n; j++) {
      const a = TAU * (j / n) + y * .017;
      const r = radius(y, a) * (.955 + rand() * .055);
      const ornament = rand() < .018;
      const color = ornament ? pick(['#ff6c86','#eb9dde','#9da0ff','#ffaf70','#c8f5ef']) : pick(greens);
      add(Math.cos(a) * r, y + (rand() - .5) * 5, Math.sin(a) * r, ornament ? pick('@oO&') : pick('01x+*#%<>:;'), color, 'leaf', { normal: a, ornament });
    }
  }
  // A continuous double-thread helix. Near and far segments share real depth.
  for (let i = 0; i < 860; i++) {
    const h = i / 859, y = 139 + h * 695, a = h * TAU * 4.65 + .8;
    const r = radius(y, a) + 11;
    add(Math.cos(a) * r, y, Math.sin(a) * r, pick('*+o@'), golds[2 + (i % 4)], 'ribbon', { normal: a });
    if (i % 3 === 0) add(Math.cos(a + .028) * (r + 2), y + 7, Math.sin(a + .028) * (r + 2), '.', '#ffcd6e', 'ribbon', { normal: a + .028 });
  }
  // Exposed cylindrical bark and distinct branching roots.
  for (let y = -62; y < 145; y += 9) for (let j = 0; j < 20; j++) {
    const a = TAU * j / 20, r = 28 + 5 * Math.sin(y * .04 + a * 3);
    add(Math.cos(a) * r, y, Math.sin(a) * r, pick('|/\\#:=Y'), pick(['#a7774b','#ca9660','#e6b67b','#8f6247']), 'wood', { normal:a });
  }
  for (let k = 0; k < 9; k++) {
    const a = k * TAU / 9;
    for (let i = 0; i < 32; i++) {
      const t = i / 31, r = 24 + t * (125 + k % 3 * 20), aa = a + .22 * Math.sin(t * Math.PI);
      for (let j = 0; j < 2; j++) add(Math.cos(aa) * r + j * 5, -49 - t * 73, Math.sin(aa) * r, pick('=/\\Y#'), pick(['#b68856','#e1b77c','#cfa36c']), 'wood', { normal:aa });
    }
  }
  const star = [];
  for (let i = 0; i < 10; i++) { const a = -Math.PI/2 + i*Math.PI/5, r = i%2 ? 35 : 82; star.push([Math.cos(a)*r,Math.sin(a)*r]); }
  function inside(x,y) { let hit=false; for(let i=0,j=9;i<10;j=i++) if(((star[i][1]>y)!==(star[j][1]>y))&&(x<(star[j][0]-star[i][0])*(y-star[i][1])/(star[j][1]-star[i][1])+star[i][0]))hit=!hit;return hit; }
  for(let y=-82;y<=78;y+=8) for(let x=-80;x<=80;x+=8) if(inside(x,y)) {
    add(x, 963-y, 20, pick('*+@#'), pick(golds.slice(2)), 'star', { sx:x, sy:-y, sz:20 });
    add(x, 963-y, -20, pick('+:#'), golds[1], 'star', { sx:x, sy:-y, sz:-20 });
  }
  for(let i=0;i<10;i++) {
    const a=star[i],b=star[(i+1)%10],n=Math.ceil(Math.hypot(b[0]-a[0],b[1]-a[1])/6);
    for(let j=0;j<=n;j++) for(let z=-20;z<=20;z+=8) {
      const q=j/n,x=a[0]*(1-q)+b[0]*q,y=-(a[1]*(1-q)+b[1]*q);
      add(x,963+y,z,'+',z===20?'#fff4c5':'#c68a36','star',{sx:x,sy:y,sz:z});
    }
  }
  // Gifts are six-face cuboids with glyph ribbons, raised lids, and ASCII bows.
  const gifts = [
    {x:-292,y:-94,z:80,w:112,h:108,d:96,c:['#b93b66','#eb638e','#ff91ac'],a:-.35},
    {x:-164,y:-118,z:255,w:91,h:77,d:86,c:['#337eaf','#53aacc','#9adce7'],a:.35},
    {x:160,y:-105,z:225,w:111,h:100,d:101,c:['#824aa7','#b274ce','#dca8e7'],a:-.3},
    {x:301,y:-101,z:50,w:100,h:90,d:90,c:['#b23d43','#e96665','#ffada0'],a:.2}
  ];
  gifts.forEach((g,id)=>{
    const put=(x,y,z,face)=>{
      const ribbon = Math.abs(x)<9 || (face==='top'&&Math.abs(z)<9);
      add(0,0,0,ribbon?pick('+#='):pick('#%x+@'),ribbon?pick(golds.slice(2)):g.c[face==='top'?2:face==='side'?0:1],'gift',{gx:x,gy:y,gz:z,gid:id,ribbon});
    };
    for(let y=0;y<=g.h;y+=8) for(let x=-g.w/2;x<=g.w/2;x+=7.5){put(x,y,g.d/2,'front');put(x,y,-g.d/2,'side');}
    for(let y=0;y<=g.h;y+=8) for(let z=-g.d/2;z<=g.d/2;z+=8){put(-g.w/2,y,z,'side');put(g.w/2,y,z,'front');}
    for(let x=-g.w/2;x<=g.w/2;x+=7.5) for(let z=-g.d/2;z<=g.d/2;z+=8)put(x,g.h+4,z,'top');
    for(let side of [-1,1])for(let j=0;j<36;j++){
      const a=j/36*TAU;
      add(0,0,0,pick('+*@'),pick(golds.slice(2)),'gift',{gx:side*(17+17*Math.cos(a)),gy:g.h+12+15*Math.sin(a),gz:5*Math.sin(a),gid:id,ribbon:true});
    }
  });
  for(let i=0;i<610;i++) {
    const a=rand()*TAU,r=95+rand()*440;
    add(Math.cos(a)*r,-139-rand()*4,Math.sin(a)*r*.8,pick('.:+' ),pick(['#244657','#335465','#557177','#9a916b']),'floor');
  }
  for(let i=0;i<320;i++)snow.push({x:rand()*W,y:rand()*H,p:rand()*TAU,size:8+rand()*15,alpha:.12+rand()*.55,loops:1+i%2});
  const dust=Array.from({length:180},()=>({x:rand()*W,y:rand()*H,p:rand()*TAU,s:5+rand()*8}));
  const wishDust=[];
  for(const line of [{s:'marry Christmas',y:1635,size:64,start:7.9},{s:'tian zisu !',y:1733,size:94,start:9.7}]){
    const m=document.createElement('canvas');m.width=1080;m.height=150;
    const a=m.getContext('2d');a.font=`italic ${line.size}px Georgia, "Times New Roman", serif`;a.textAlign='center';a.textBaseline='middle';a.fillStyle='white';a.fillText(line.s,540,75);
    const data=a.getImageData(0,0,1080,150).data;
    for(let y=0;y<150;y+=7)for(let x=0;x<1080;x+=7)if(data[(y*1080+x)*4+3]>100)wishDust.push({x,y:line.y+y-75,p:rand()*TAU,r:60+rand()*180,start:line.start+(x-180)/720*1.4});
  }
  function sprite(ch,color,glow) {
    const key=ch+color+glow;
    if(sprites.has(key))return sprites.get(key);
    const c=document.createElement('canvas');c.width=c.height=52;
    const a=c.getContext('2d');a.font='bold 14px Consolas, "Courier New", monospace';a.textAlign='center';a.textBaseline='middle';a.fillStyle=color;
    if(glow){a.shadowColor=color;a.shadowBlur=glow===2?12:5;a.fillText(ch,26,26);a.shadowBlur=0;}
    a.fillText(ch,26,26);sprites.set(key,c);return c;
  }
  function glyph(ch,x,y,size,color,alpha=1,glow=0) {
    ctx.globalAlpha=Math.max(0,Math.min(1,alpha));const s=size/14*52;
    ctx.drawImage(sprite(ch,color,glow),x-s/2,y-s/2,s,s);
  }
  const bg=document.createElement('canvas');bg.width=W;bg.height=H;
  const b=bg.getContext('2d');b.fillStyle='#030914';b.fillRect(0,0,W,H);
  let grad=b.createRadialGradient(535,930,50,535,930,790);grad.addColorStop(0,'#0c242c');grad.addColorStop(.55,'#07131f');grad.addColorStop(1,'#030711');b.fillStyle=grad;b.fillRect(0,0,W,H);
  grad=b.createRadialGradient(540,1410,0,540,1410,470);grad.addColorStop(0,'#142329');grad.addColorStop(1,'#07111c00');b.fillStyle=grad;b.fillRect(0,1100,W,650);
  function text(str,y,size,color,font='Consolas, monospace',spacing=0,alpha=1) {
    ctx.globalAlpha=alpha;ctx.fillStyle=color;ctx.font=`${size}px ${font}`;ctx.textAlign='center';ctx.textBaseline='middle';
    if(!spacing){ctx.fillText(str,W/2,y);return;}
    const chars=Array.from(str),width=chars.reduce((n,ch)=>n+ctx.measureText(ch).width,0)+spacing*(chars.length-1);let x=(W-width)/2;
    ctx.textAlign='left';for(const ch of chars){ctx.fillText(ch,x,y);x+=ctx.measureText(ch).width+spacing;}
  }
  function revealText(str,y,size,start,t){
    ctx.font=`italic ${size}px Georgia, "Times New Roman", serif`;ctx.textBaseline='middle';ctx.textAlign='left';
    const chars=Array.from(str),width=ctx.measureText(str).width;let x=(W-width)/2;
    chars.forEach((ch,i)=>{
      const progress=clamp((t-start-i*.105)/1.05),settle=1-Math.pow(1-progress,3),w=ctx.measureText(ch).width;
      if(progress>0){
        ctx.globalAlpha=smooth(progress*2);ctx.fillStyle='#f8e5bd';ctx.shadowColor='#eebb69';ctx.shadowBlur=(1-progress)*23+2;
        ctx.fillText(ch,x+Math.sin(i*2.7)*(1-settle)*25,y+(1-settle)*40);
      }
      x+=w;
    });ctx.shadowBlur=0;ctx.globalAlpha=1;
  }
  function arrival(p,t){
    if(p.type==='leaf')return smooth((t-.45-(p.y-125)/725*2.15)/1.65);
    if(p.type==='ribbon')return smooth((t-2.8-(p.y-139)/695*1.8)/.85);
    if(p.type==='star')return smooth((t-4.7)/1.1);
    if(p.type==='gift')return smooth((t-4.6-p.gid*.28)/1.1);
    if(p.type==='wood')return smooth((t-.3)/1.7);
    return smooth(t/2.5);
  }
  function draw(t) {
    const loop=t/20*TAU,rot=loop*options.speed+view,cs=Math.cos(rot),sn=Math.sin(rot),out=[];
    const zoom=1+.22*(1-smooth((t-2.5)/4)),baseY=1307;
    const project=(x,y,z)=>{const f=D/(D-z);return {x:540+x*f*zoom,y:870+(baseY-(y+z*.105)*f-870)*zoom,f};};
    ctx.globalAlpha=1;ctx.drawImage(bg,0,0);
    text('FOR YOU, TIAN ZISU',112,20,'#e0c996','Consolas, monospace',5,smooth(t/1.5));
    text('A LITTLE CHRISTMAS MAGIC',157,13,'#6d939e','Consolas, monospace',3,smooth((t-.5)/2));
    for(const d of dust)glyph('.',d.x+Math.sin(loop+d.p)*18,d.y,d.s,'#8bd9ec',(.06+.1*Math.sin(loop*2+d.p)**2));
    for(const s of snow){
      const yy=((s.y+t/20*H*s.loops)%H+H)%H,xx=s.x+Math.sin(loop+s.p)*17;
      glyph(s.size>20?'*':s.size>14?'+':'.',xx,yy,s.size,'#b8d6dd',s.alpha*options.snow*(.45+.25*smooth(t/6)));
    }
    for(const p of points){
      const gather=arrival(p,t);if(gather===0)continue;
      let x=p.x,y=p.y,z=p.z,n=1,alpha=1,sz=13,glow=0;
      if(p.type==='star'){
        const a=.38+Math.sin(loop)*.65,ca=Math.cos(a),sa=Math.sin(a);x=p.sx*ca+p.sz*sa;y=963+p.sy;z=-p.sx*sa+p.sz*ca;
        alpha=.7+.3*Math.sin(loop*5+p.phase)**2;glow=options.glow>.25?2:0;sz=14;
      }else if(p.type==='gift'){
        const g=gifts[p.gid],a=g.a+Math.sin(loop)*.35,ca=Math.cos(a),sa=Math.sin(a);
        x=g.x+p.gx*ca+p.gz*sa;y=g.y+p.gy;z=g.z-p.gx*sa+p.gz*ca;sz=13.5;
        alpha=.72+.28*Math.sin(loop*3+p.phase)**2;glow=p.ribbon&&options.glow>.25?1:0;
      }else if(p.type!=='floor'){
        const xx=x*cs+z*sn;z=-x*sn+z*cs;x=xx;
        n=Math.sin(p.normal-rot);
        if(p.type==='leaf'){
          alpha=n<-.08?.075:.38+.62*Math.max(0,n);
          alpha*=.84+.16*Math.sin(loop*2+p.phase);if(p.ornament){glow=options.glow>.5?1:0;sz=16;}
        }else if(p.type==='ribbon'){
          alpha=n<-.1?.075:.7+.3*Math.max(0,n);glow=options.glow>.25?2:0;sz=13.8;
          alpha*=.82+.18*Math.sin(loop*4+p.phase)**2;
        }else{alpha=n<0?.28:.9;sz=14;}
      }else{alpha=.5;sz=10;}
      if(gather<1){
        const remain=1-gather,a=p.phase+t*.9;
        x+=Math.cos(a)*remain*(250+p.phase*38);z+=Math.sin(a)*remain*260;
        y+=remain*(Math.sin(p.phase*3)*310-130);alpha*=smooth(gather*2);
        if(p.type==='star')y+=remain*180;
      }
      const q=project(x,y,z),px=q.x,py=q.y;
      if(px<-30||px>W+30||py<180||py>1580)continue;
      out.push({p,px,py,z,sz:sz*q.f*zoom,alpha,glow});
    }
    // Two blue-white comets weave in front of and behind the glyph branches.
    if(t>2.6)for(let band=0;band<2;band++)for(let j=0;j<160;j++){
      const head=((t-2.6)/5.1+band*.48)%1,h=(head-j*.00135+1)%1;
      const y=155+h*680,a=h*TAU*4.65+.8-rot,r=radius(y,a+rot)+23+band*6;
      const x=Math.cos(a)*r,z=Math.sin(a)*r,q=project(x,y,z),front=Math.sin(a);
      const alpha=(1-j/160)*smooth((t-2.6)/1.3)*(front<0?.06:.87)*options.glow;

      out.push({p:{ch:j<3?'*':'.',color:j<7?'#fff0c1':'#80d0ed'},px:q.x,py:q.y,z,sz:j<4?19:9,alpha:(1-j/145)*.7*smooth((t-4)/1.8)*options.glow,glow:j<18?2:1});

  <script>
(() => {
  'use strict';
  const shell = document.getElementById('gift-shell');
  const fullscreenButton = document.getElementById('fullscreen');
  const status = document.getElementById('status');
  const api = () => window.__christmas;

  document.getElementById('replay').addEventListener('click', () => {
    const scene = api();
    if (!scene) return;
    if (typeof scene.replay === 'function') scene.replay();
    else { scene.setTime(0); scene.play(); }
    status.textContent = '再送你一场圣诞星光。';
  });

  const isImmersive = () => Boolean(document.fullscreenElement) || document.body.classList.contains('immersive');
  function updateFullscreenLabel() {
    const active = isImmersive();
    fullscreenButton.textContent = active ? '退出全屏' : '全屏';
    fullscreenButton.setAttribute('aria-pressed', String(active));
  }
  async function fullscreen() {
    if (document.fullscreenElement) {
      try { await document.exitFullscreen(); }
      catch { status.textContent = '可按 Esc 退出全屏。'; }
    } else if (document.body.classList.contains('immersive')) {
      document.body.classList.remove('immersive');
    } else {
      try {
        if (!shell.requestFullscreen) throw new Error('Fullscreen unavailable');
        await shell.requestFullscreen();
      } catch {
        document.body.classList.add('immersive');
      }
    }
    updateFullscreenLabel();
  }
  fullscreenButton.addEventListener('click', fullscreen);
  document.addEventListener('fullscreenchange', updateFullscreenLabel);
  document.addEventListener('keydown', event => {
    if (event.key === 'Escape' && document.body.classList.contains('immersive')) {
      document.body.classList.remove('immersive');
      updateFullscreenLabel();
    }
  });

  // A tap can add a little extra starlight; a drag stays a rotation gesture.
  const canvas = document.getElementById('scene');
  let pressed = null;
  canvas.addEventListener('pointerdown', event => {
    pressed = { x: event.clientX, y: event.clientY, id: event.pointerId };
  });
  canvas.addEventListener('pointerup', event => {
    if (!pressed || event.pointerId !== pressed.id) return;
    const moved = Math.hypot(event.clientX - pressed.x, event.clientY - pressed.y);
    pressed = null;
    const scene = api();
    if (moved > 9 || typeof scene?.celebrate !== 'function') return;
    const box = canvas.getBoundingClientRect();
    scene.celebrate((event.clientX - box.left) / box.width * canvas.width,
      (event.clientY - box.top) / box.height * canvas.height);
  });
  canvas.addEventListener('pointercancel', () => { pressed = null; });
})();

</script>
